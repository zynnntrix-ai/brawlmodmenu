plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brawl.modmenu'
    compileSdk 34

    defaultConfig {
        applicationId "com.brawl.modmenu"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
